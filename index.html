<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>紫金全球矿业数据库 V3.8</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>
<style>
html,body,#map{height:100%;margin:0;font-family:"Microsoft YaHei"}
.header{position:absolute;top:0;left:0;right:0;height:60px;background:#fff;z-index:999;padding:15px 30px;box-shadow:0 2px 8px #ddd}
.logo{font-size:22px;color:#008f83;font-weight:bold}
.nav button{margin-left:30px}
.menu{position:absolute;right:30px;top:80px;background:#008f83;color:white;z-index:999;width:260px}
.menu div{padding:12px;border-bottom:1px solid #ddd;cursor:pointer}
.legend{position:absolute;bottom:20px;left:20px;background:#fff;z-index:999;padding:10px}
</style>
</head>
<body>
<div class="header">
<span class="logo">紫金全球矿业数据库</span>
<span class="nav">
<button onclick="switchMode('global')">全球矿区</button>
<button onclick="switchMode('china')">中国矿区</button>
</span>
</div>

<div class="menu">
<div onclick="filterRegion('中国项目')">中国项目</div>
<div onclick="filterRegion('中亚及俄罗斯/蒙古项目')">中亚及俄罗斯/蒙古项目</div>
<div onclick="filterRegion('欧洲项目')">欧洲项目</div>
<div onclick="filterRegion('非洲项目')">非洲项目</div>
<div onclick="filterRegion('大洋洲项目')">大洋洲项目</div>
<div onclick="filterRegion('南美洲项目')">南美洲项目</div>
</div>

<div id="map"></div>
<div class="legend">0-1km　1-5km　5-10km　10-50km</div>

<script>
const tk="33ac08696d718b87238863a0aad7967e";
const map=L.map("map").setView([25,105],3);

let layers=[];
let features=[];

const img=L.tileLayer(
'https://t0.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk='+tk
).addTo(map);

function field(p,a){
 for(let k of a){if(p[k]!=null)return p[k]}
 return "-";
}

function popup(p){
return `<b>${field(p,['项目名','项目名称','NAME'])}</b><hr>
地区：${field(p,['地区'])}<br>
国家：${field(p,['国家'])}<br>
一级行政区：${field(p,['一级行政区'])}<br>
最近城市：${field(p,['最近城市'])}<br>
主要矿种：${field(p,['主要矿种'])}<br>
项目状态：${field(p,['项目状态'])}<br>
紫金持股比例：${field(p,['紫金持股比例','紫金持'])}<br>
开采方式：${field(p,['开采方式'])}`;
}

function addPolygon(g,buffer=false){
let l=L.geoJSON(g,{
style:buffer?{color:"#888",weight:1,fillOpacity:.05}:{color:"#008f83",weight:2,fillColor:"#26a69a",fillOpacity:.35},
interactive:!buffer,
onEachFeature:(f,x)=>{
 if(!buffer){
 x.bindPopup(popup(f.properties||{}));
 features.push({layer:x,p:f.properties||{}});
 }
}
}).addTo(map);
layers.push(l);
}

function addPoint(g){
let l=L.geoJSON(g,{
pointToLayer:(f,lat)=>L.circleMarker(lat,{radius:4,color:"#008f83",fillOpacity:1}),
onEachFeature:(f,x)=>{x.bindPopup(popup(f.properties||{}));features.push({layer:x,p:f.properties||{}})}
}).addTo(map);
layers.push(l);
}

async function load(name,type){
let r=await fetch("./data/"+name);
if(!r.ok)return;
let g=await shp(await r.arrayBuffer());
if(type==="point") addPoint(g);
else addPolygon(g,type==="buffer");
}

function clearData(){
layers.forEach(l=>map.removeLayer(l));
layers=[];
features=[];
}

function switchMode(m){
clearData();
fetch("./data/config.json").then(r=>r.json()).then(c=>{
if(m==="china"){
load(c.layers.china_polygon,"polygon");
load(c.layers.china_polygon_mul,"buffer");
}else{
load(c.layers.global_polygon,"polygon");
load(c.layers.global_point,"point");
load(c.layers.global_polygon_mul,"buffer");
load(c.layers.global_point_mul,"buffer");
}
});
}

function filterRegion(r){
features.forEach(x=>{
let v=field(x.p,['地区']);
x.layer.setStyle({opacity:v===r?1:0.2,fillOpacity:v===r?0.5:0.05});
});
}

switchMode("global");
</script>
</body>
</html>
