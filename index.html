<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>紫金全球矿业数据库 V4.2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>
<style>
html,body,#map{height:100%;margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;color:#1f2933}
#map{background:#dfe4e8}
.header{position:absolute;top:0;left:0;right:0;height:64px;box-sizing:border-box;background:#fff;z-index:1000;padding:16px 30px;box-shadow:0 2px 10px rgba(0,0,0,.14);color:#008f83;font-size:22px;font-weight:700;letter-spacing:0}
.tree{position:absolute;right:20px;top:82px;width:320px;max-height:calc(100% - 112px);background:#fff;z-index:800;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:auto;border-radius:6px}
.tree-title{padding:14px 16px;background:#008f83;color:#fff;font-weight:700}
.group{border-bottom:1px solid #e5e8eb}
.group-head{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;border:0;background:#fff;padding:12px 14px;text-align:left;font-weight:700;color:#263238;cursor:pointer}
.group-head:hover,.item:hover{background:#f4faf9}
.arrow{display:inline-block;width:16px;color:#008f83}
.count{margin-left:auto;color:#6b7785;font-weight:400;font-size:12px}
.items{display:none;padding:2px 0 8px}
.group.open .items{display:block}
.group.open .arrow{transform:rotate(90deg)}
.item{width:100%;box-sizing:border-box;border:0;background:#fff;padding:8px 16px 8px 38px;text-align:left;line-height:1.4;cursor:pointer;font-size:14px;color:#1f2933}
.item.active{background:#e7f5f3;color:#006e66;font-weight:700}
.leaflet-top{top:74px}
.leaflet-control-layers{border:0!important;border-radius:6px!important;box-shadow:0 8px 24px rgba(0,0,0,.16)!important}
.leaflet-control-layers-expanded{padding:12px 14px!important}
.leaflet-control-layers label{margin:7px 0}
.legend{position:absolute;left:20px;bottom:24px;z-index:800;background:#fff;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:12px 14px;font-size:13px;line-height:1.8}
.legend-title{font-weight:700;color:#263238;margin-bottom:4px}
.legend-row{display:flex;align-items:center;gap:8px;white-space:nowrap}
.swatch{width:18px;height:4px;border-radius:2px;display:inline-block}
.popup{min-width:260px}
.popup h3{margin:0 0 8px;color:#008f83;font-size:18px}
.popup table{border-collapse:collapse;width:100%}
.popup td{padding:5px 4px;border-top:1px solid #edf0f2;vertical-align:top}
.popup td:first-child{color:#65717d;width:104px;white-space:nowrap}
.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:850;background:#fff;padding:12px 18px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);color:#263238}
.error{position:absolute;left:20px;right:20px;bottom:20px;z-index:1200;background:#fff0f0;color:#9f1c1c;border:1px solid #efb5b5;border-radius:6px;padding:12px 14px;display:none}
@media (max-width:760px){
  .header{height:56px;padding:14px 16px;font-size:18px}
  .leaflet-top{top:64px}
  .tree{left:10px;right:10px;top:auto;bottom:94px;width:auto;max-height:35%}
  .legend{left:10px;bottom:10px;font-size:12px}
}
</style>
</head>
<body>
<div class="header">紫金全球矿业数据库</div>
<div class="tree" id="tree"><div class="tree-title">项目树</div></div>
<div class="legend">
  <div class="legend-title">缓冲区距离</div>
  <div class="legend-row"><span class="swatch" style="background:#d73027"></span>0-1 km</div>
  <div class="legend-row"><span class="swatch" style="background:#f2c94c"></span>1-5 km</div>
  <div class="legend-row"><span class="swatch" style="background:#2f80ed"></span>5-10 km</div>
  <div class="legend-row"><span class="swatch" style="background:#8a8f98"></span>10-50 km</div>
</div>
<div class="loading" id="loading">正在加载矿区数据...</div>
<div class="error" id="error"></div>
<div id="map"></div>

<script>
const tk = "b0a621b97567938401b93e15062220c6";
const subdomains = ["0","1","2","3","4","5","6","7"];

const map = L.map("map", { zoomControl: false }).setView([25,105], 3);
L.control.zoom({ position: "bottomleft" }).addTo(map);

map.createPane("bufferPane");
map.createPane("minePane");
map.createPane("pointPane");
map.getPane("bufferPane").style.zIndex = 410;
map.getPane("bufferPane").style.pointerEvents = "none";
map.getPane("minePane").style.zIndex = 430;
map.getPane("pointPane").style.zIndex = 450;

const imageryLayer = L.tileLayer(
  "https://t{s}.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=" + tk,
  { subdomains, maxZoom: 18, attribution: "天地图" }
).addTo(map);

const labelLayer = L.tileLayer(
  "https://t{s}.tianditu.gov.cn/DataServer?T=cia_w&x={x}&y={y}&l={z}&tk=" + tk,
  { subdomains, maxZoom: 18, attribution: "天地图" }
).addTo(map);

let mineLayer;
let pointLayer;
let bufferLayer;
let layerControl;
const projects = new Map();
const allLocatedLayers = [];

const schema = {
  region:  { index: 0, aliases: ["地区","区域","Region","REGION","region"] },
  name:    { index: 1, aliases: ["项目名","项目名称","名称","Project","PROJECT","project","NAME","Name","name"] },
  country: { index: 2, aliases: ["国家","Country","COUNTRY","country"] },
  admin:   { index: 3, aliases: ["一级行政区","一级行政","一级行","Admin1","ADMIN1","admin1"] },
  city:    { index: 4, aliases: ["最近城市","最近城","城市","NearCity","NEARCITY","nearCity","nearcity"] },
  mineral: { index: 5, aliases: ["主要矿种","主要矿","矿种","Minerals","MINERALS","minerals"] },
  status:  { index: 6, aliases: ["项目状态","项目状","状态","Status","STATUS","status"] },
  pct:     { index: 7, aliases: ["紫金持股比例","紫金持","持股比例","ZijinPct","ZIJINPCT","zijinPct","zijinpct"] },
  mining:  { index: 8, aliases: ["开采方式","开采方","采矿方法","Mining","MINING","mining"] },
  distance:{ aliases: ["distance","Distance","DISTANCE","距离","缓冲区","缓冲距离","radius","Radius","range","Range","buffer","Buffer"] }
};

function normalizeKey(value) {
  return String(value || "").toLowerCase().replace(/[\s_\-().（）]/g, "");
}

function hasText(value) {
  return value !== null && value !== undefined && String(value).trim() !== "" && String(value).trim() !== "-";
}

function valueText(value) {
  return hasText(value) ? String(value).trim() : "";
}

function fieldValue(props, field) {
  const keys = Object.keys(props || {});
  const wanted = (field.aliases || []).map(normalizeKey);
  for (const key of keys) {
    if ((field.aliases || []).includes(key) || wanted.includes(normalizeKey(key))) {
      const value = valueText(props[key]);
      if (value) return value;
    }
  }
  if (Number.isInteger(field.index) && keys.length >= 9) {
    const value = valueText(props[keys[field.index]]);
    if (value) return value;
  }
  return "";
}

function display(value) {
  return valueText(value) || "-";
}

function esc(value) {
  return display(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function projectInfo(props) {
  return {
    region: fieldValue(props, schema.region) || "其他",
    name: fieldValue(props, schema.name) || "未命名项目",
    country: fieldValue(props, schema.country),
    admin: fieldValue(props, schema.admin),
    city: fieldValue(props, schema.city),
    mineral: fieldValue(props, schema.mineral),
    status: fieldValue(props, schema.status),
    pct: fieldValue(props, schema.pct),
    mining: fieldValue(props, schema.mining)
  };
}

function colorMineral(props) {
  const mineral = fieldValue(props, schema.mineral);
  if (mineral.includes("铜")) return "#d73027";
  if (mineral.includes("金")) return "#f2c94c";
  if (mineral.includes("锂")) return "#2f80ed";
  if (mineral.includes("锌") || mineral.includes("铅")) return "#219653";
  return "#263238";
}

function popupHtml(props) {
  const info = projectInfo(props || {});
  return `<div class="popup">
    <h3>${esc(info.name)}</h3>
    <table>
      <tr><td>地区</td><td>${esc(info.region)}</td></tr>
      <tr><td>国家</td><td>${esc(info.country)}</td></tr>
      <tr><td>一级行政区</td><td>${esc(info.admin)}</td></tr>
      <tr><td>最近城市</td><td>${esc(info.city)}</td></tr>
      <tr><td>主要矿种</td><td>${esc(info.mineral)}</td></tr>
      <tr><td>项目状态</td><td>${esc(info.status)}</td></tr>
      <tr><td>紫金持股比例</td><td>${esc(info.pct)}</td></tr>
      <tr><td>开采方式</td><td>${esc(info.mining)}</td></tr>
    </table>
  </div>`;
}

function bufferBand(props) {
  const direct = fieldValue(props || {}, schema.distance);
  const text = String(direct || Object.values(props || {}).join(" ")).replace(/\s+/g, "");
  if (/(^|[^0-9])0[-–—~至]1(?:km|公里)?/i.test(text)) return "0-1";
  if (/(^|[^0-9])1[-–—~至]5(?:km|公里)?/i.test(text)) return "1-5";
  if (/(^|[^0-9])5[-–—~至]10(?:km|公里)?/i.test(text)) return "5-10";
  if (/(^|[^0-9])10[-–—~至]50(?:km|公里)?/i.test(text)) return "10-50";

  const number = Number.parseFloat(String(direct || "").replace(",", "."));
  if (Number.isFinite(number)) {
    if (number <= 1.000001) return "0-1";
    if (number <= 5.000001) return "1-5";
    if (number <= 10.000001) return "5-10";
    return "10-50";
  }
  return "10-50";
}

function bufferStyle(feature) {
  const styles = {
    "0-1":  { color: "#d73027", fillColor: "#d73027", weight: 2.4, fillOpacity: .13 },
    "1-5":  { color: "#f2c94c", fillColor: "#f2c94c", weight: 2.1, fillOpacity: .11 },
    "5-10": { color: "#2f80ed", fillColor: "#2f80ed", weight: 1.9, fillOpacity: .09 },
    "10-50":{ color: "#8a8f98", fillColor: "#8a8f98", weight: 1.6, fillOpacity: .06 }
  };
  return styles[bufferBand(feature.properties)] || styles["10-50"];
}

function bufferRank(feature) {
  return { "10-50": 4, "5-10": 3, "1-5": 2, "0-1": 1 }[bufferBand(feature.properties)] || 0;
}

async function shpLoad(file) {
  const response = await fetch("./data/" + file);
  if (!response.ok) throw new Error(file + " 加载失败");
  return shp(await response.arrayBuffer());
}

function toFeatures(input) {
  if (!input) return [];
  if (Array.isArray(input)) return input.flatMap(toFeatures);
  if (input.type === "FeatureCollection") return input.features || [];
  if (input.type === "Feature") return [input];
  return [];
}

async function loadConfiguredShapes(config, keys) {
  const collections = [];
  for (const key of keys) {
    const file = config.layers && config.layers[key];
    if (!file) continue;
    try {
      collections.push(await shpLoad(file));
    } catch (error) {
      console.warn(error);
    }
  }
  return {
    type: "FeatureCollection",
    features: collections.flatMap(toFeatures)
  };
}

function rememberProject(props, layer, kind) {
  const info = projectInfo(props);
  const key = normalizeKey(info.region + "|" + info.name);
  if (!projects.has(key)) {
    projects.set(key, { ...info, layer, kind });
  } else if (kind === "mine") {
    projects.get(key).layer = layer;
    projects.get(key).kind = kind;
  }
}

function zoomToLayer(layer) {
  if (!layer) return;
  if (typeof layer.getBounds === "function") {
    const bounds = layer.getBounds();
    if (bounds && bounds.isValid && bounds.isValid()) {
      map.fitBounds(bounds, { padding: [60, 60], maxZoom: 9 });
      return;
    }
  }
  if (typeof layer.getLatLng === "function") {
    map.setView(layer.getLatLng(), 8);
  }
}

function loadMine(data) {
  mineLayer = L.geoJSON(data, {
    pane: "minePane",
    style: feature => {
      const color = colorMineral(feature.properties || {});
      return { color, fillColor: color, fillOpacity: .28, weight: 2.2 };
    },
    onEachFeature: (feature, layer) => {
      const props = feature.properties || {};
      layer.bindPopup(popupHtml(props));
      rememberProject(props, layer, "mine");
      allLocatedLayers.push(layer);
    }
  }).addTo(map);
}

function loadPoint(data) {
  pointLayer = L.geoJSON(data, {
    pane: "pointPane",
    pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
      radius: 5,
      color: "#fff",
      weight: 1.2,
      fillColor: colorMineral(feature.properties || {}),
      fillOpacity: 1
    }),
    onEachFeature: (feature, layer) => {
      const props = feature.properties || {};
      layer.bindPopup(popupHtml(props));
      rememberProject(props, layer, "point");
      allLocatedLayers.push(layer);
    }
  }).addTo(map);
}

function loadBuffer(data) {
  const ordered = {
    type: "FeatureCollection",
    features: [...(data.features || [])].sort((a, b) => bufferRank(b) - bufferRank(a))
  };
  bufferLayer = L.geoJSON(ordered, {
    pane: "bufferPane",
    style: bufferStyle,
    interactive: false
  }).addTo(map);
}

function buildTree() {
  const box = document.getElementById("tree");
  box.innerHTML = '<div class="tree-title">项目树</div>';
  const groups = new Map();
  const regionOrder = ["中国项目","中亚及俄罗斯 / 蒙古项目","中亚及俄罗斯/蒙古项目","欧洲项目","非洲项目","大洋洲项目","南美洲项目","其他"];

  [...projects.values()].forEach(project => {
    if (!groups.has(project.region)) groups.set(project.region, []);
    groups.get(project.region).push(project);
  });

  const regions = [...groups.keys()].sort((a, b) => {
    const ai = regionOrder.indexOf(a);
    const bi = regionOrder.indexOf(b);
    if (ai !== -1 || bi !== -1) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    return a.localeCompare(b, "zh-CN");
  });

  regions.forEach((region, index) => {
    const group = document.createElement("div");
    group.className = "group" + (index === 0 ? " open" : "");

    const head = document.createElement("button");
    head.className = "group-head";
    head.type = "button";
    head.innerHTML = `<span class="arrow">▶</span><span>${esc(region)}</span><span class="count">${groups.get(region).length}</span>`;
    head.addEventListener("click", () => group.classList.toggle("open"));

    const list = document.createElement("div");
    list.className = "items";
    groups.get(region)
      .sort((a, b) => a.name.localeCompare(b.name, "zh-CN"))
      .forEach(project => {
        const item = document.createElement("button");
        item.className = "item";
        item.type = "button";
        item.textContent = project.name;
        item.addEventListener("click", event => {
          event.stopPropagation();
          document.querySelectorAll(".item.active").forEach(el => el.classList.remove("active"));
          item.classList.add("active");
          zoomToLayer(project.layer);
          project.layer.openPopup();
        });
        list.appendChild(item);
      });

    group.appendChild(head);
    group.appendChild(list);
    box.appendChild(group);
  });
}

function fitInitialBounds() {
  const group = L.featureGroup(allLocatedLayers);
  const bounds = group.getBounds();
  if (bounds && bounds.isValid && bounds.isValid()) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 4 });
  }
}

function showError(message) {
  const box = document.getElementById("error");
  box.textContent = message;
  box.style.display = "block";
}

function setupLayerControl() {
  if (layerControl) map.removeControl(layerControl);
  layerControl = L.control.layers({}, {
    "遥感影像": imageryLayer,
    "地名标注": labelLayer,
    "矿区范围": mineLayer,
    "矿点": pointLayer,
    "缓冲区": bufferLayer
  }, { collapsed: false, position: "topleft" }).addTo(map);
}

async function boot() {
  try {
    const config = await fetch("./data/config.json").then(response => response.json());
    const [mineData, pointData, bufferData] = await Promise.all([
      loadConfiguredShapes(config, ["global_polygon", "china_polygon"]),
      loadConfiguredShapes(config, ["global_point"]),
      loadConfiguredShapes(config, ["global_polygon_mul", "global_point_mul", "china_polygon_mul"])
    ]);

    loadBuffer(bufferData);
    loadMine(mineData);
    loadPoint(pointData);
    setupLayerControl();
    buildTree();
    fitInitialBounds();
  } catch (error) {
    console.error(error);
    showError("数据加载失败，请检查 data/config.json 和 SHP ZIP 文件是否完整。");
  } finally {
    const loading = document.getElementById("loading");
    if (loading) loading.style.display = "none";
  }
}

boot();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
