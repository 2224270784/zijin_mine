.arrow{display:inline-block;width:16px;color:#008f83}

.item{width:100%;box-sizing:border-box;border:0;background:#fff;padding:8px 16px 8px 38px;text-align:left;line-height:1.4;cursor:pointer;font-size:14px;color:#1f2933}
.item.active{background:#e7f5f3;color:#006e66;font-weight:700}
.leaflet-top{top:74px}
.leaflet-control-layers{border:0!important;border-radius:6px!important;box-shadow:0 8px 24px rgba(0,0,0,.16)!important}

.legend-card{width:132px;min-width:128px;max-width:100%;overflow:hidden}

.legend-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;box-sizing:border-box;border:0;background:#fff;color:#263238;font:inherit;font-weight:700;padding:10px 12px;cursor:pointer}
.legend-toggle::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid #008f83;transition:transform .15s ease}
.legend-card.collapsed .legend-toggle::after{transform:rotate(-90deg)}
.legend-card.collapsed .legend-body{display:none}
.legend-body{padding:0 12px 10px;max-height:182px;overflow:auto}
.mineral-legend{position:absolute;z-index:800;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;gap:24px;background:rgba(255,255,255,.92);padding:12px 14px;max-width:calc(100% - 520px);overflow:auto}
.legend-title{font-weight:700;color:#263238;margin-bottom:4px}
.legend-divider{height:1px;background:#e3e8ed;margin:8px 0 6px}
.legend-row{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;column-gap:8px}
.legend-symbol{width:28px;height:18px;display:flex;align-items:center;justify-content:center}
.legend-label{min-width:0;line-height:1.35}
.legend-card[data-legend-card="buffer"] .legend-label{white-space:nowrap}
.swatch{width:18px;height:4px;border-radius:2px;display:inline-block}

.area-swatch.diagonal{border:1.3px solid #111;background-image:repeating-linear-gradient(135deg,transparent 0,transparent 4px,rgba(0,0,0,.28) 4px,rgba(0,0,0,.28) 5px)}

.outside-mask-canvas{position:absolute;pointer-events:none}

.mineral-cn{font-weight:700}
.mineral-en{font-size:12px;color:#008f83}

.popup h3{margin:0 0 8px;color:#008f83;font-size:18px}
.popup-kind{display:inline-block;margin-bottom:6px;padding:2px 7px;border:1px solid #cfd8dc;border-radius:4px;color:#455a64;background:#f7fafb;font-size:12px}
.popup table{border-collapse:collapse;width:100%}
.popup td{padding:5px 4px;border-top:1px solid #edf0f2;vertical-align:top}

.stat-label{margin-top:4px;color:#53646d;font-size:12px;line-height:1.3}

.stats-table{width:100%;border-collapse:collapse;font-size:13px;min-width:980px}

  .legend-card{min-width:138px}

  .legend-symbol{width:26px}
  .legend-body{max-height:112px;padding:0 10px 9px}
  .mineral-legend{left:10px;right:10px;bottom:8px;transform:none;justify-content:flex-start;gap:14px;overflow:auto;font-size:12px}

  .stats-head{display:block}
  .stats-filter{justify-content:flex-start;margin-top:10px}
  .stats-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats-table{min-width:820px}
}
@media (min-width:761px) and (max-width:1380px){

  .mineral-legend{bottom:8px;max-width:calc(100% - 40px)}

const GENERIC_MINE_TOKENS = new Set(["金矿","铜矿","银矿","锌矿","铅矿","铁矿","锂矿","矿山","矿区","项目"]);

function normalizeKey(value) {
  return String(value || "").toLowerCase().replace(/[\s_\-().（）]/g, "");
}

function normalizeMatchText(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/[\s_\-–—().（）,，、/／+＋;；:：]/g, "");
}

function uniqueValues(values) {
  return [...new Set(values.map(valueText).filter(Boolean))];
}

function splitMineNames(value) {
  const text = valueText(value);
  if (!text) return [];
  return text
    .split(/\s*(?:[-–—、,，;；/／+＋]|和|与|及)\s*/g)
    .map(valueText)
    .filter(Boolean);
}

function namesMatch(projectName, mineName) {
  const projectKey = normalizeMatchText(projectName);
  const mineKey = normalizeMatchText(mineName);
  if (!projectKey || !mineKey) return false;
  if (projectKey === mineKey) return true;
  const minLength = Math.min(projectKey.length, mineKey.length);
  const shortKey = projectKey.length <= mineKey.length ? projectKey : mineKey;
  if (shortKey.length <= 2 && GENERIC_MINE_TOKENS.has(shortKey)) return false;
  const minRequired = /[\u4e00-\u9fff]/.test(projectKey + mineKey) ? 2 : 4;
  return minLength >= minRequired && (projectKey.includes(mineKey) || mineKey.includes(projectKey));
}

function hasText(value) {
  return value !== null && value !== undefined && String(value).trim() !== "" && String(value).trim() !== "-";
}

function valueText(value) {
  return hasText(value) ? String(value).trim() : "";
}

function fieldValue(props, field) {
  const keys = Object.keys(props || {});
  const wanted = (field.aliases || []).map(normalizeKey);
  for (const key of keys) {
    if ((field.aliases || []).includes(key) || wanted.includes(normalizeKey(key))) {
      const value = valueText(props[key]);
      if (value) return value;
    }
  }
  if (Number.isInteger(field.index) && keys.length >= 9) {
    const value = valueText(props[keys[field.index]]);
    if (value) return value;
  }
  return "";
}

function display(value) {
  return valueText(value) || "-";
}

function esc(value) {
  return display(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function t(key) {
  return (UI_TEXT[currentLang] && UI_TEXT[currentLang][key]) || UI_TEXT.zh[key] || key;
}

function translateValue(value, category) {
  const raw = valueText(value);
  if (!raw) return "-";
  if (currentLang === "zh") return raw;
  if (category === "pct") return raw.replace("（权益比例）", " (equity interest)");
  const dict = EN_VALUES[category] || {};
  if (dict[raw]) return dict[raw];
  return raw;
}

function projectStatsRows() {
  return [...projects.values()].map(project => {
    const grouped = projectRelatedBiodiversity(project.props || project);
    const counts = Object.fromEntries(
      BIODIVERSITY_LAYERS.map(item => [item.key, (grouped[item.key] || []).length])
    );
    const entries = BIODIVERSITY_LAYERS.flatMap(item => grouped[item.key] || []);
    const ringValues = entries
      .map(entry => biodiversityRingSortValue(biodiversityInfo(entry.props)))
      .filter(value => value.label);
    ringValues.sort((a, b) => a.rank - b.rank);
    return {
      project,
      grouped,
      counts,
      total: Object.values(counts).reduce((sum, count) => sum + count, 0),
      nearest: ringValues.length ? ringValues[0].label : null
    };
  }).sort((a, b) => {
    if (b.total !== a.total) return b.total - a.total;
    const regionCompare = translateValue(a.project.region, "region")
      .localeCompare(translateValue(b.project.region, "region"), currentLang === "en" ? "en" : "zh-CN");
    if (regionCompare) return regionCompare;
    return translateValue(a.project.name, "project")
      .localeCompare(translateValue(b.project.name, "project"), currentLang === "en" ? "en" : "zh-CN");
  });
}

function colorMineral(props) {

  if (mineral.includes("锌") || mineral.includes("铅")) return "#3f6f69";

function projectMatchValues(props) {
  const info = projectInfo(props || {});
  return {
    ids: uniqueValues([fieldValue(props || {}, projectMatchSchema.id)]).map(normalizeMatchText),
    names: uniqueValues([
      info.name,
      fieldValue(props || {}, projectMatchSchema.name),
      ...splitMineNames(info.name),
      ...splitMineNames(fieldValue(props || {}, projectMatchSchema.name))
    ])
  };
}

function biodiversityMineValues(props) {
  const mineName = fieldValue(props || {}, biodiversitySchema.mineName);
  return {
    ids: uniqueValues([fieldValue(props || {}, biodiversitySchema.mineId)]).map(normalizeMatchText),
    names: uniqueValues([mineName, ...splitMineNames(mineName)])
  };
}

function biodiversityEntryMatchesProject(entry, projectProps) {
  const projectValues = projectMatchValues(projectProps);
  const mineValues = biodiversityMineValues(entry.props);
  if (projectValues.ids.length && mineValues.ids.length) {
    if (projectValues.ids.some(id => mineValues.ids.includes(id))) return true;
  }
  return projectValues.names.some(projectName =>
    mineValues.names.some(mineName => namesMatch(projectName, mineName))
  );
}

function biodiversitySortValue(entry) {
  const info = biodiversityInfo(entry.props);
  const ring = biodiversityRingSortValue(info);
  const name = info.name || "";
  return {
    distance: ring.rank,
    name
  };
}

function projectRelatedBiodiversity(projectProps) {
  const grouped = Object.fromEntries(BIODIVERSITY_LAYERS.map(item => [item.key, []]));
  const seen = new Set();
  biodiversityEntries.forEach(entry => {
    if (!biodiversityEntryMatchesProject(entry, projectProps)) return;
    const info = biodiversityInfo(entry.props);
    const uniqueKey = [
      entry.key,
      fieldValue(entry.props, biodiversitySchema.bioId),
      info.name,
      info.rings,
      info.minKm,
      info.maxKm
    ].map(normalizeMatchText).join("|");
    if (seen.has(uniqueKey)) return;
    seen.add(uniqueKey);
    grouped[entry.key].push(entry);
  });
  Object.keys(grouped).forEach(key => {
    grouped[key].sort((a, b) => {
      const av = biodiversitySortValue(a);
      const bv = biodiversitySortValue(b);
      if (av.distance !== bv.distance) return av.distance - bv.distance;
      return av.name.localeCompare(bv.name, currentLang === "en" ? "en" : "zh-CN");
    });
  });
  return grouped;
}

function formatMeasure(value) {
  const text = valueText(value);
  if (!text) return "-";
  const number = Number.parseFloat(text);
  if (!Number.isFinite(number)) return text;
  return number.toFixed(2).replace(/\.?0+$/, "");
}

function formatRingText(value) {
  const text = valueText(value).replace(/\s+/g, "");
  if (!text) return "";
  const normalized = text.replace(/[–—~至]/g, "-").replace(/公里/g, "km");
  const range = normalized.match(/(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)(?:km)?/i);
  if (range) return `${formatMeasure(range[1])}-${formatMeasure(range[2])} km`;
  const single = normalized.match(/(\d+(?:\.\d+)?)(?:km)?/i);
  return single ? `${formatMeasure(single[1])} km` : text;
}

function biodiversityRangeLabel(info) {
  const ring = formatRingText(info.rings);
  if (ring) return ring;
  const minKm = formatMeasure(info.minKm);
  const maxKm = formatMeasure(info.maxKm);
  if (minKm !== "-" && maxKm !== "-") return minKm === maxKm ? `${minKm} km` : `${minKm}-${maxKm} km`;
  if (minKm !== "-") return `${minKm} km`;
  if (maxKm !== "-") return `${maxKm} km`;
  return "";
}

function biodiversityRingSortValue(info) {
  const label = biodiversityRangeLabel(info);
  const compact = label.replace(/\s+/g, "");
  const order = { "0-1km": 1, "1-5km": 2, "5-10km": 3, "10-50km": 4 };
  if (order[compact]) return { rank: order[compact], label };
  const distance = Number.parseFloat(valueText(info.minKm));
  return {
    rank: Number.isFinite(distance) ? distance + 100 : 9999,
    label
  };
}

    rings: fieldValue(props || {}, biodiversitySchema.rings),

function bufferBand(props) {
  const direct = fieldValue(props || {}, schema.distance);
  const text = String(direct || Object.values(props || {}).join(" ")).replace(/\s+/g, "");
  if (/(^|[^0-9])0[-–—~至]1(?:km|公里)?/i.test(text)) return "0-1";
  if (/(^|[^0-9])1[-–—~至]5(?:km|公里)?/i.test(text)) return "1-5";
  if (/(^|[^0-9])5[-–—~至]10(?:km|公里)?/i.test(text)) return "5-10";
  if (/(^|[^0-9])10[-–—~至]50(?:km|公里)?/i.test(text)) return "10-50";

  const number = Number.parseFloat(String(direct || "").replace(",", "."));
  if (Number.isFinite(number)) {
    if (number <= 1.000001) return "0-1";
    if (number <= 5.000001) return "1-5";
    if (number <= 10.000001) return "5-10";
    return "10-50";
  }
  return "10-50";
}

function bufferStyle(feature) {
  const band = BUFFER_BAND_BY_KEY[bufferBand(feature.properties)] || BUFFER_BAND_BY_KEY["10-50"];
  return { color: band.color, weight: band.weight, opacity: .95, fillOpacity: 0 };
}

function bufferRank(feature) {
  return { "10-50": 4, "5-10": 3, "1-5": 2, "0-1": 1 }[bufferBand(feature.properties)] || 0;
}

async function vectorLoad(file) {
  const response = await fetch("./data/" + file);
  if (!response.ok) throw new Error(file + " 加载失败");
  const cleanFile = String(file).split("?")[0].toLowerCase();
  if (cleanFile.endsWith(".geojson") || cleanFile.endsWith(".json")) return response.json();
  if (cleanFile.endsWith(".zip")) return shp(await response.arrayBuffer());
  throw new Error(file + " 格式暂不支持");
}

function listValues(value) {
  if (!value) return [];
  return Array.isArray(value) ? value.filter(Boolean) : [value];
}

function layerNameMatches(name, filters) {
  const wanted = listValues(filters).map(normalizeKey).filter(Boolean);
  if (!wanted.length) return true;
  const normalized = normalizeKey(name);
  return wanted.some(filter => normalized === filter || normalized.includes(filter));
}

function toFeatures(input, layerFilters) {
  if (!input) return [];
  if (Array.isArray(input)) return input.flatMap(item => toFeatures(item, layerFilters));
  if (input.type === "FeatureCollection") return input.features || [];
  if (input.type === "Feature") return [input];
  if (typeof input === "object") {
    return Object.entries(input)
      .filter(([name]) => layerNameMatches(name, layerFilters))
      .flatMap(([, value]) => toFeatures(value));
  }
  return [];
}

async function loadConfiguredShapes(config, keys) {
  const collections = [];
  for (const key of keys) {
    const file = config.layers && config.layers[key];
    if (!file) continue;
    try {
      collections.push(await vectorLoad(file));
    } catch (error) {
      console.warn(error);
    }
  }
  return {
    type: "FeatureCollection",
    features: collections.flatMap(collection => toFeatures(collection))
  };
}

function sourcesFromConfig(source) {
  if (!source) return [];
  if (typeof source === "string") return [{ file: source }];
  if (Array.isArray(source)) return source.flatMap(sourcesFromConfig);
  if (Array.isArray(source.files)) {
    return source.files
      .filter(Boolean)
      .map(file => ({ ...source, file }));
  }
  if (typeof source.file === "string") return [source];
  return [];
}

async function loadOptionalVectorFiles(sources) {
  const collections = [];
  for (const source of sources) {
    const file = source.file;
    if (!file) continue;
    try {
      collections.push({
        data: await vectorLoad(file),
        layers: source.layer || source.layers || source.sourceLayer || source.sourceLayers
      });
    } catch (error) {
      console.warn(error);
    }
  }
  return {
    type: "FeatureCollection",
    features: collections.flatMap(collection => toFeatures(collection.data, collection.layers))
  };
}

async function loadBiodiversityData(config, key) {
  const source = (config.biodiversity && config.biodiversity[key]) || (config.layers && config.layers[key]);
  return loadOptionalVectorFiles(sourcesFromConfig(source));
}

function rememberProject(props, layer, kind) {
  const info = projectInfo(props);
  const key = normalizeKey(info.region + "|" + info.name);
  if (!projects.has(key)) {
    projects.set(key, { key, ...info, props, layer, kind });
  } else if (kind === "mine") {
    Object.assign(projects.get(key), { ...info, props, layer, kind });
  }
}

function zoomToLayer(layer) {
  if (!layer) return;
  if (typeof layer.getBounds === "function") {
    const bounds = layer.getBounds();
    if (bounds && bounds.isValid && bounds.isValid()) {
      map.fitBounds(bounds, { padding: [60, 60], maxZoom: 9 });
      return;
    }
  }
  if (typeof layer.getLatLng === "function") {
    map.setView(layer.getLatLng(), 8);
  }
}

function loadMine(data) {
  mineLayer = L.geoJSON(data, {
    pane: "minePane",
    style: feature => {
      const color = colorMineral(feature.properties || {});
      return { color, fillColor: color, fillOpacity: .28, weight: 2.2 };
    },
    onEachFeature: (feature, layer) => {
      const props = feature.properties || {};
      layer._zijinProps = props;
      layer.bindPopup(popupHtml(props));
      rememberProject(props, layer, "mine");
      allLocatedLayers.push(layer);
    }
  }).addTo(map);
}

function loadPoint(data) {
  pointLayer = L.geoJSON(data, {
    pane: "pointPane",
    pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
      radius: 5,
      color: "#fff",
      weight: 1.2,
      fillColor: colorMineral(feature.properties || {}),
      fillOpacity: 1
    }),
    onEachFeature: (feature, layer) => {
      const props = feature.properties || {};
      layer._zijinProps = props;
      layer.bindPopup(popupHtml(props));
      rememberProject(props, layer, "point");
      allLocatedLayers.push(layer);
    }
  }).addTo(map);
}

function loadBuffer(data) {
  bufferLayers = {};
  const orderedFeatures = [...(data.features || [])].sort((a, b) => bufferRank(b) - bufferRank(a));
  [...BUFFER_BANDS].reverse().forEach(band => {
    const features = orderedFeatures.filter(feature => bufferBand(feature.properties) === band.key);
    bufferLayers[band.key] = L.geoJSON({
      type: "FeatureCollection",
      features
    }, {
      pane: "bufferPane",
      style: bufferStyle,
      interactive: false
    }).addTo(map);
  });
}

function registerBiodiversityEntry(item, props, layer) {
  const entry = {
    id: `bio-${++biodiversityEntrySeq}`,
    key: item.key,
    textKey: item.textKey,
    item,
    props,
    layer
  };
  biodiversityEntries.push(entry);
  return entry;
}

function biodiversityStyle(item, highlighted = false) {
  return {
    color: highlighted ? "#f59e0b" : item.color,
    weight: highlighted ? 2.8 : 1.3,
    opacity: highlighted ? 1 : .95,
    fillOpacity: item.fillColor ? 1 : 0,
    fillColor: item.fillColor || "transparent",
    dashArray: item.dashArray || null,
    className: item.popup ? "biodiv-clickable" : ""
  };
}

function setWhcMarkerHighlight(layer, highlighted) {
  const element = layer && layer.getElement && layer.getElement();
  if (element) element.classList.toggle("highlighted", highlighted);
}

function highlightBiodiversityLayer(layer, item) {
  if (layer.setStyle) layer.setStyle(biodiversityStyle(item, true));
  else setWhcMarkerHighlight(layer, true);
  if (layer.bringToFront) layer.bringToFront();
}

function resetBiodiversityLayer(layer, item) {
  if (activeBiodiversityEntry && activeBiodiversityEntry.layer === layer) return;
  if (layer.setStyle) layer.setStyle(biodiversityStyle(item));
  else setWhcMarkerHighlight(layer, false);
}

function clearActiveBiodiversity() {
  if (!activeBiodiversityEntry) return;
  const { layer, item } = activeBiodiversityEntry;
  activeBiodiversityEntry = null;
  if (layer && item) resetBiodiversityLayer(layer, item);
}

function focusBiodiversityEntry(id) {
  const entry = biodiversityEntries.find(item => item.id === id);
  if (!entry || !entry.layer) return;
  clearActiveBiodiversity();
  const parentLayer = biodiversityLayers[entry.key];
  if (parentLayer && !map.hasLayer(parentLayer)) map.addLayer(parentLayer);
  activeBiodiversityEntry = entry;
  zoomToLayer(entry.layer);
  highlightBiodiversityLayer(entry.layer, entry.item);
  if (entry.layer.openPopup) entry.layer.openPopup();
}

function whcTriangleMarker(latlng, interactive = false) {
  return L.marker(latlng, {
    pane: "biodivPointPane",
    interactive,
    icon: L.divIcon({
      className: "whc-marker",
      iconSize: [14, 13],
      iconAnchor: [7, 7]
    })
  });
}

function loadBiodiversityLayers(dataByKey) {
  biodiversityLayers = {};
  biodiversityEntries.length = 0;
  biodiversityEntrySeq = 0;
  activeBiodiversityEntry = null;
  BIODIVERSITY_LAYERS.forEach(item => {
    const data = dataByKey[item.key] || { type: "FeatureCollection", features: [] };
    biodiversityLayers[item.key] = L.geoJSON(data, {
      pane: item.marker ? "biodivPointPane" : "biodivAreaPane",
      interactive: Boolean(item.popup),
      style: () => biodiversityStyle(item),
      pointToLayer: (feature, latlng) => item.marker ? whcTriangleMarker(latlng, Boolean(item.popup)) : L.circleMarker(latlng, biodiversityStyle(item)),
      onEachFeature: (feature, layer) => {
        if (!item.popup) return;
        layer._zijinBiodiversityProps = feature.properties || {};
        layer._zijinBiodiversityTextKey = item.textKey;
        layer._zijinBiodiversityStyle = item;
        const entry = registerBiodiversityEntry(item, layer._zijinBiodiversityProps, layer);
        layer._zijinBiodiversityId = entry.id;
        layer.bindPopup(biodiversityPopupHtml(layer._zijinBiodiversityProps, item.textKey));
        layer.on({
          mouseover: () => highlightBiodiversityLayer(layer, item),
          mouseout: () => resetBiodiversityLayer(layer, item),
          click: () => {
            clearActiveBiodiversity();
            activeBiodiversityEntry = entry;
            highlightBiodiversityLayer(layer, item);
          },
          popupclose: () => {
            if (activeBiodiversityEntry && activeBiodiversityEntry.id === entry.id) activeBiodiversityEntry = null;
            resetBiodiversityLayer(layer, item);
          }
        });
      }
    }).addTo(map);
  });
}

function closeRing(ring) {
  if (!Array.isArray(ring) || ring.length < 3) return null;
  const closed = ring.map(point => [point[0], point[1]]);
  const first = closed[0];
  const last = closed[closed.length - 1];
  if (first[0] !== last[0] || first[1] !== last[1]) closed.push([first[0], first[1]]);
  return closed;
}

function exteriorRings(geometry) {
  if (!geometry) return [];
  if (geometry.type === "Polygon") return [geometry.coordinates && geometry.coordinates[0]].map(closeRing).filter(Boolean);
  if (geometry.type === "MultiPolygon") {
    return geometry.coordinates
      .map(polygon => polygon && polygon[0])
      .map(closeRing)
      .filter(Boolean);
  }
  return [];
}

function createOutsideMaskLayer(clearRings) {
  const MaskLayer = L.Layer.extend({
    onAdd(mapInstance) {
      this._map = mapInstance;
      this._canvas = L.DomUtil.create("canvas", "outside-mask-canvas");
      mapInstance.getPane("maskPane").appendChild(this._canvas);
      mapInstance.on("moveend zoomend resize viewreset", this._reset, this);
      this._reset();
    },
    onRemove(mapInstance) {
      mapInstance.off("moveend zoomend resize viewreset", this._reset, this);
      if (this._canvas && this._canvas.parentNode) this._canvas.parentNode.removeChild(this._canvas);
      this._canvas = null;
    },
    _reset() {
      if (!this._map || !this._canvas) return;
      const size = this._map.getSize();
      const ratio = window.devicePixelRatio || 1;
      const topLeft = this._map.containerPointToLayerPoint([0, 0]);
      L.DomUtil.setPosition(this._canvas, topLeft);
      this._canvas.width = Math.round(size.x * ratio);
      this._canvas.height = Math.round(size.y * ratio);
      this._canvas.style.width = `${size.x}px`;
      this._canvas.style.height = `${size.y}px`;
      const ctx = this._canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, size.x, size.y);
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.fillRect(0, 0, size.x, size.y);
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "#000";
      clearRings.forEach(ring => this._clearRing(ctx, ring, topLeft));
      ctx.globalCompositeOperation = "source-over";
    },
    _clearRing(ctx, ring, topLeft) {
      if (!Array.isArray(ring) || ring.length < 3) return;
      let started = false;
      ctx.beginPath();
      ring.forEach(coord => {
        if (!Array.isArray(coord) || coord.length < 2) return;
        const point = this._map.latLngToLayerPoint([coord[1], coord[0]]).subtract(topLeft);
        if (!Number.isFinite(point.x) || !Number.isFinite(point.y)) return;
        if (started) ctx.lineTo(point.x, point.y);
        else {
          ctx.moveTo(point.x, point.y);
          started = true;
        }
      });
      if (!started) return;
      ctx.closePath();
      ctx.fill();
    }
  });
  return new MaskLayer();
}

function loadOutsideMask(data) {
  const clearRings = (data.features || [])
    .filter(feature => bufferBand(feature.properties) === "10-50")
    .flatMap(feature => exteriorRings(feature.geometry));

  outsideMaskLayer = createOutsideMaskLayer(clearRings).addTo(map);
}

function isChinaProject(project) {
  return normalizeMatchText(project.region).includes(normalizeMatchText("中国项目")) ||
    normalizeMatchText(project.country) === normalizeMatchText("中国");
}

function sortProjects(list) {
  return [...list].sort((a, b) =>
    translateValue(a.name, "project").localeCompare(
      translateValue(b.name, "project"),
      currentLang === "en" ? "en" : "zh-CN"
    )
  );
}

function createGroup(title, count, className = "group") {
  const group = document.createElement("div");
  group.className = className;
  const head = document.createElement("button");
  head.className = "group-head";
  head.type = "button";
  head.innerHTML = `<span class="arrow">▶</span><span>${esc(title)}</span><span class="count">${count}</span>`;
  head.addEventListener("click", event => {
    event.stopPropagation();
    group.classList.toggle("open");
  });
  const list = document.createElement("div");
  list.className = "items";
  group.appendChild(head);
  group.appendChild(list);
  return { group, list };
}

function appendProjectButton(list, project) {
  const item = document.createElement("button");
  item.className = "item";
  item.type = "button";
  item.textContent = translateValue(project.name, "project");
  item.addEventListener("click", event => {
    event.stopPropagation();
    document.querySelectorAll(".item.active").forEach(el => el.classList.remove("active"));
    item.classList.add("active");
    zoomToLayer(project.layer);
    project.layer.openPopup();
  });
  list.appendChild(item);
}

function buildTree() {
  const box = document.getElementById("tree");
  box.innerHTML = "";
  const allProjects = [...projects.values()];
  const chinaProjects = allProjects.filter(isChinaProject);
  const worldProjects = allProjects.filter(project => !isChinaProject(project));
  const regionOrder = ["中亚及俄罗斯 / 蒙古项目","中亚及俄罗斯/蒙古项目","欧洲项目","非洲项目","大洋洲项目","南美洲项目","其他"];

  const chinaGroup = createGroup(t("zijinChina"), chinaProjects.length, "group root-group");
  sortProjects(chinaProjects).forEach(project => appendProjectButton(chinaGroup.list, project));
  box.appendChild(chinaGroup.group);

  const worldGroup = createGroup(t("zijinWorld"), worldProjects.length, "group root-group");
  const worldRegions = new Map();
  worldProjects.forEach(project => {
    const region = project.region || UI_TEXT.zh.other;
    if (!worldRegions.has(region)) worldRegions.set(region, []);
    worldRegions.get(region).push(project);
  });

  [...worldRegions.keys()]
    .sort((a, b) => {
      const ai = regionOrder.indexOf(a);
      const bi = regionOrder.indexOf(b);
      if (ai !== -1 || bi !== -1) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      return translateValue(a, "region").localeCompare(translateValue(b, "region"), currentLang === "en" ? "en" : "zh-CN");
    })
    .forEach(region => {
      const regionProjects = worldRegions.get(region);
      const regionGroup = createGroup(translateValue(region, "region"), regionProjects.length, "group region-group");
      sortProjects(regionProjects).forEach(project => appendProjectButton(regionGroup.list, project));
      worldGroup.list.appendChild(regionGroup.group);
    });

  box.appendChild(worldGroup.group);
}

function fitInitialBounds() {
  const group = L.featureGroup(allLocatedLayers);
  const bounds = group.getBounds();
  if (bounds && bounds.isValid && bounds.isValid()) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 4 });
  }
}

function showError(message) {
  const box = document.getElementById("error");
  box.textContent = message || t("loadError");
  box.style.display = "block";
}

function setupLayerControl() {
  if (layerControl) map.removeControl(layerControl);
  const overlays = {
    [t("layerImagery")]: imageryLayer,
    [t("layerLabels")]: labelLayer,
    [t("layerOutside")]: outsideMaskLayer
  };
  BIODIVERSITY_LAYERS.forEach(item => {
    if (biodiversityLayers[item.key]) overlays[t(item.textKey)] = biodiversityLayers[item.key];
  });
  BUFFER_BANDS.forEach(band => {
    if (bufferLayers[band.key]) overlays[t(band.textKey)] = bufferLayers[band.key];
  });
  overlays[t("layerMines")] = mineLayer;
  overlays[t("layerPoints")] = pointLayer;
  layerControl = L.control.layers({}, overlays, { collapsed: true, position: "topleft" }).addTo(map);
}

async function boot() {
  try {
    const config = await fetch("./data/config.json").then(response => response.json());
    const [mineData, pointData, bufferData, kbaData, wdpaData, whcData] = await Promise.all([
      loadConfiguredShapes(config, ["global_polygon", "china_polygon"]),
      loadConfiguredShapes(config, ["global_point"]),
      loadConfiguredShapes(config, ["global_polygon_mul", "global_point_mul", "china_polygon_mul"]),
      loadBiodiversityData(config, "kba"),
      loadBiodiversityData(config, "wdpa"),
      loadBiodiversityData(config, "whc")
    ]);

    loadOutsideMask(bufferData);
    loadBuffer(bufferData);
    loadBiodiversityLayers({ kba: kbaData, wdpa: wdpaData, whc: whcData });
    loadMine(mineData);
    loadPoint(pointData);
    setupLayerControl();
    buildTree();
    dataReady = true;
    renderStatsPanel();
    fitInitialBounds();
  } catch (error) {
    console.error(error);
    showError();
  } finally {
    const loading = document.getElementById("loading");
    if (loading) loading.style.display = "none";
  }
}

renderStaticText();
document.querySelectorAll(".lang-btn").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.lang));
});
document.querySelectorAll("[data-view]").forEach(button => {
  button.addEventListener("click", () => setActiveView(button.dataset.view));
});
setupLegendToggles();

map.on("popupopen", event => {
  const container = event.popup && event.popup.getElement && event.popup.getElement();
  if (!container) return;
  container.querySelectorAll("[data-bio-id]").forEach(button => {
    button.addEventListener("click", clickEvent => {
      clickEvent.preventDefault();
      clickEvent.stopPropagation();
      focusBiodiversityEntry(button.dataset.bioId);
    });
  });
});

boot();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
