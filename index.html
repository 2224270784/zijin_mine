<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>紫金全球矿业数据库</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>
<style>
html,body,#map{height:100%;margin:0;font-family:"Microsoft YaHei"}
.header{position:absolute;top:0;left:0;right:0;height:60px;background:#fff;z-index:999;padding:15px 30px;box-sizing:border-box;box-shadow:0 2px 8px #ddd}
.logo{font-size:22px;font-weight:bold;color:#008f83}
.menu{position:absolute;right:30px;top:80px;background:#008f83;color:#fff;z-index:999}
.menu div{padding:12px 25px;border-bottom:1px solid rgba(255,255,255,.3)}
.legend{position:absolute;bottom:20px;left:20px;background:#fff;z-index:999;padding:10px}
.mine-popup h3{margin:0 0 12px;font-size:18px;border-bottom:1px solid #ddd;padding-bottom:8px}
.mine-popup table{width:100%;border-collapse:collapse;font-size:14px}
.mine-popup td{padding:6px 4px}
.mine-popup td:first-child{color:#666;width:90px}
</style>
</head>
<body>
<div class="header"><div class="logo">紫金全球矿业数据库　 全球矿区　 中国矿区</div></div>
<div class="menu">
<div>中国项目 +</div><div>中亚及俄罗斯项目 +</div><div>欧洲项目 +</div>
<div>非洲项目 +</div><div>大洋洲项目 +</div><div>南美洲项目 +</div>
</div>
<div id="map"></div>
<div class="legend">铜　金　锌铅　锂　其他</div>
<script>
const tk="33ac08696d718b87238863a0aad7967e";
const map=L.map("map").setView([25,105],3);
L.tileLayer(`https://t0.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${tk}`).addTo(map);

function popupHTML(p){
let fields=[
["地区","地区"],
["国家","国家"],
["一级行政区","一级行政区"],
["最近城市","最近城市"],
["主要矿种","主要矿种"],
["项目状态","项目状态"],
["紫金持股比例","紫金持股比例"],
["开采方式","开采方式"]
];
let h='<div class="mine-popup"><h3>'+(p["项目名"]||"-")+'</h3><table>';
fields.forEach(f=>{h+="<tr><td>"+f[0]+"</td><td>"+(p[f[1]]||"-")+"</td></tr>"});
return h+"</table></div>";
}

async function load(file){
let r=await fetch("./data/"+file);
if(!r.ok)return;
let g=await shp(await r.arrayBuffer());
L.geoJSON(g,{
style:{color:"#008f83",weight:2,fillOpacity:.15},
onEachFeature:(f,l)=>l.bindPopup(popupHTML(f.properties||{}))
}).addTo(map);
}

fetch("./data/config.json").then(r=>r.json()).then(c=>{
load(c.layers.global_polygon);
load(c.layers.global_point);
});
</script>
</body>
</html>
