<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>紫金全球矿业数据库 V3.0</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:"Microsoft YaHei",Arial}
body{overflow:hidden}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}
.side{background:#fff;border-right:1px solid #ddd;padding:18px;overflow:auto}
.logo{font-size:22px;font-weight:bold;margin-bottom:20px}
.menu div{padding:10px;border-bottom:1px solid #eee;cursor:pointer}
#map{height:100%}
.legend{position:absolute;bottom:20px;left:340px;background:#fff;padding:12px;border-radius:8px;z-index:999}
</style>
</head>
<body>
<div class="app">
<div class="side">
<div class="logo">紫金全球矿业数据库</div>
<div>全球矿区</div>
<div>中国矿区</div>
<h3>区域项目</h3>
<div class="menu">
<div>中国项目 +</div>
<div>中亚及俄罗斯项目 +</div>
<div>欧洲项目 +</div>
<div>非洲项目 +</div>
<div>大洋洲项目 +</div>
<div>南美洲项目 +</div>
</div>
<h3>矿种</h3>
<div>🔴 铜矿</div>
<div>🟡 金矿</div>
<div>🟢 锌铅</div>
<div>🔵 锂矿</div>
<div>⚫ 其他</div>
</div>
<div style="position:relative"><div id="map"></div>
<div class="legend">紫金全球矿业数据库 V3.0</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([20,100],3);

const tk="33ac08696d718b87238863a0aad7967e";
L.tileLayer(
`https://t0.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${tk}`,
{maxZoom:18}
).addTo(map);

// V3 数据入口
fetch("./data/config.json")
.then(r=>r.json())
.then(c=>console.log("数据库配置",c))
.catch(e=>console.log("等待矿区数据"));

</script>
</body>
</html>
